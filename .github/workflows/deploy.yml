name: Déploiement
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôle d'intégrité (bloque le déploiement en cas d'ERREUR)
        run: node outils/verifier.mjs
      - name: Tests de l'API des commentaires (Worker)
        run: node --test worker/test.mjs
  deploy:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }} # variable du dépôt GitHub (Settings → Secrets and variables → Actions → Variables)
    steps:
      - name: Jeton Cloudflare présent ?
        id: jeton
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Secret CLOUDFLARE_API_TOKEN absent : déploiement ignoré." >> "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.jeton.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.jeton.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.jeton.outputs.ok == 'true'
      - name: Toutes les images référencées sont dans R2
        if: steps.jeton.outputs.ok == 'true'
        run: node outils/r2.mjs manquantes
      - run: sh deployer.sh
        if: steps.jeton.outputs.ok == 'true'
