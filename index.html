<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbre généalogique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceeea">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  /* Mise en page : arbre ascendant en colonnes par génération, zoomable ; fiche de la personne à droite (en volet bas sur téléphone). */
  :root {
    --bg: #eceeea; --surface: #f9faf7; --ink: #1d2729; --muted: #667074;
    --line: #c3c9c4; --accent: #2c4a7c; --m: #3b6f96; --f: #a04a6b;
    --fa: #2e7d4f; --fb: #2c6fb0; --fc: #a86a00; --fd: #b23a3a; --hl: #b86e00; --hlbg: #fbecd2; --eau: #8fb3cf;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  /* Thème clair pour tous, même si l'appareil est en mode sombre (choix du gabarit). */
  :root[data-theme="dark"] {
    --bg: #161b1d; --surface: #1f2628; --ink: #e4e9e6; --muted: #94a09f;
    --line: #3a4447; --accent: #8fb0e6; --m: #7db4da; --f: #e094b0;
    --fa: #6fcf97; --fb: #7fb6ee; --fc: #e2aa4c; --fd: #f08a8a; --hl: #f0b44c; --hlbg: #3a2f1c; --eau: #3d6680;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--serif);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { padding-block: 18px 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: normal; text-wrap: balance; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  #barre { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 8px; font: 13px var(--sans); }
  #zoom { display: flex; gap: 6px; }
  #zoom button { min-width: 40px; height: 36px; padding: 0 10px; font: 500 14px var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  #zoom button:hover { border-color: var(--accent); }
  #legende { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
  .niv { display: inline-flex; align-items: center; gap: 6px; }
  .niv i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .niv.A i { background: var(--fa); } .niv.B i { background: var(--fb); }
  .niv.C i { background: var(--fc); border-radius: 2px; } .niv.D i { background: var(--fd); border-radius: 0; transform: rotate(45deg); }
  main { display: flex; gap: 16px; padding-block: 0 24px; align-items: flex-start; }
  #zone { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    min-width: 0; height: 78vh; touch-action: pan-x pan-y; overscroll-behavior: contain; }
  #cadre { position: relative; margin: 20px; }
  #arbre { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #arbre svg { position: absolute; inset: 0; pointer-events: none; }
  #arbre path { fill: none; stroke: var(--line); stroke-width: 1.5; }
  #arbre path.implexe { stroke: var(--fd); stroke-dasharray: 6 5; }
  #arbre path.faible { stroke-dasharray: 2 4; stroke-linecap: round; }
  .carte.commun { outline: 2px dashed var(--fd); outline-offset: 2px; }
  #fiche .fiab.commun { border-color: var(--fd); border-style: dashed; }
  .gen { position: absolute; top: 0; font: 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .carte { position: absolute; width: 210px; height: 70px; padding: 9px 12px; text-align: left;
    background: var(--bg); color: inherit; font: inherit; cursor: pointer;
    border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 8px; }
  .carte.M { border-left-color: var(--m); } .carte.F { border-left-color: var(--f); }
  .carte:hover, .carte.actif { border-color: var(--accent); }
  .carte.actif { box-shadow: 0 0 0 2px var(--accent); }
  .carte.inconnu { border-style: dashed; background: transparent; }
  .carte.inconnu .n { color: var(--muted); font-style: italic; }
  .carte .n { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
  .carte .d { display: block; font: 12px/1.4 var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte .niv { position: absolute; top: 9px; right: 9px; }
  .hist { font-size: .78em; margin-right: 4px; vertical-align: 1px; }
  .carte .fr { position: absolute; bottom: 7px; right: 8px; font: 11px/1 var(--sans); color: var(--muted); }
  #fiche .portrait { margin: 0 0 12px; }
  #fiche .photo { display: block; max-width: 100%; max-height: 300px; border-radius: 8px; }
  #fiche figcaption { margin-top: 6px; font: 12px/1.4 var(--sans); color: var(--muted); }
  #fiche .preuve { font-size: 13.5px; margin-top: 6px; }
  #fiche .preuve b { font: 500 12px var(--sans); color: var(--muted); display: block; }
  #fiche .preuve p { margin: 4px 0 0; }
  #fiche .lienp { font: 13px/1.45 var(--sans); margin: 4px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  #fiche .lienp .qui { color: var(--muted); min-width: 3.2em; }
  #fiche .lienp .niv { align-self: center; }
  #fiche details.raison { font-size: 13.5px; margin: 2px 0 8px; padding-left: 10px; border-left: 2px solid var(--line); }
  #fiche details.raison summary { font: 500 12px var(--sans); color: var(--muted); cursor: pointer; }
  #fiche details.raison p { margin: 4px 0 0; }
  #fiche { width: 330px; flex: none; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 18px 20px; }
  #fiche h2 { margin: 0 0 2px; font-size: 20px; font-weight: normal; padding-right: 30px; }
  #fiche .sous { color: var(--muted); font: 13px var(--sans); margin-bottom: 10px; }
  #fiche .fiab { font: 13px/1.4 var(--sans); margin-bottom: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #fiche .fiab b { font-weight: 500; }
  #fiche dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  #fiche dt { color: var(--muted); font: 12px/1.7 var(--sans); }
  #fiche dd { margin: 0; min-width: 0; }
  #fiche h3 { margin: 16px 0 4px; font: 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #fiche p { margin: 0; font-size: 14px; }
  #fiche ul { margin: 0; padding-left: 18px; font-size: 14px; }
  #fiche .warn li { color: var(--fc); }
  #fiche ol.chrono { list-style: none; padding: 0; margin: 4px 0 0; font-size: 14px; }
  #fiche ol.chrono li { display: block; padding: 5px 0 6px; border-top: 1px solid var(--line); line-height: 1.45; font-size: 13.5px; }
  #fiche ol.chrono li:first-child { border-top: 0; }
  #fiche ol.chrono .cd { display: block; font: 500 11.5px/1.5 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
  #fiche ol.chrono b { font-weight: 500; }
  #fiche ol.chrono sup a, #fiche ol.chrono sup { font: 10px var(--sans); text-decoration: none; }
  #fiche ol.sources { padding-left: 22px; font-size: 13px; }
  #fiche ol.sources .nat { font: 500 10.5px/1 var(--sans); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  #fiche ol.sources .nat.acte, #fiche ol.sources .nat.dossier { color: var(--fa); border-color: var(--fa); }
  #fiche ol.sources .nat.index, #fiche ol.sources .nat.arbre { color: var(--fc); border-color: var(--fc); }
  #fiche ol.chrono sup a.faible { color: var(--fc); }
  #fiche ol.sources li:target, #fiche ol.sources li.vise { background: var(--bg); outline: 1px solid var(--accent); border-radius: 4px; }
  #minicarte { height: 210px; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
  #fiche ul.lieux { list-style: none; padding: 0; margin-top: 6px; font: 13px/1.45 var(--sans); }
  #fiche ul.lieux li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; cursor: pointer; }
  #fiche ul.lieux li i { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--surface); box-shadow: 0 0 0 1px var(--line); transform: translateY(1px); }
  #fiche ul.lieux li i.evt { background: var(--accent); } #fiche ul.lieux li i.vue { background: var(--ink); border-radius: 2px; } #fiche ul.lieux li i.cite { background: var(--muted); opacity: .7; }
  #fiche ul.lieux li span { color: var(--muted); }
  #fiche a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #fermer { display: none; position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; font: 20px/1 var(--sans);
    color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  [hidden] { display: none !important; }
  .carte.frere { width: 186px; height: 38px; padding: 3px 9px; border-left-width: 3px; background: var(--surface); border-style: dashed; }
  .carte.frere .n { font-size: 13px; padding-right: 0; }
  .carte.frere .d { font-size: 11px; line-height: 1.2; }
  .carte.frere.conj { width: 166px; border-left-style: dotted; opacity: .92; }
  .carte.frere.enfant { width: 166px; }
  #arbre path.frat { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  #zoom button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  #famillezone { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px 18px; max-height: 78vh; overflow: auto; }
  #famillezone h2 { margin: 0 0 2px; font-size: 19px; font-weight: normal; }
  #recitszone { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 18px 22px 24px; max-height: 78vh; overflow: auto; }
  #recitszone .sommaire { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 18px; font: 13px var(--sans); }
  #recitszone .sommaire a { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--ink); text-decoration: none; cursor: pointer; }
  #recitszone article { max-width: 68ch; margin: 0 0 30px; }
  #recitszone h2 { margin: 0; font-size: 21px; font-weight: 600; text-wrap: balance; }
  #recitszone .lieu { margin: 2px 0 10px; font: 12px var(--sans); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  #recitszone p { margin: 0 0 10px; line-height: 1.6; }
  #recitszone a[data-id], .vie a[data-id] { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  #recitszone .note { font: 12px var(--sans); color: var(--muted); max-width: 68ch; }
  .vie { margin: 10px 0 12px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; }
  .vie h3 { margin: 0 0 4px !important; }
  .vie p { margin: 0; line-height: 1.55; }
  .vie p.epq { margin-top: 8px; font-size: .93em; color: var(--muted); }
  #recitszone .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 4px; max-width: 68ch; }
  #recitszone .galerie figure { margin: 0; min-width: 0; }
  #recitszone .galerie button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); cursor: zoom-in; }
  #recitszone .galerie img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
  #recitszone .galerie figcaption { font: 11.5px/1.35 var(--sans); color: var(--muted); margin-top: 4px; }
  #recitszone aside.epoque { margin: 14px 0 0; padding: 10px 14px 4px; border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 8px 8px 0; font: 14px/1.5 var(--sans); }
  #recitszone aside.epoque h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #recitszone aside.epoque dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
  #recitszone aside.epoque dt { font-weight: 600; font-variant-numeric: tabular-nums; }
  #recitszone aside.epoque dd { margin: 0 0 6px; min-width: 0; }
  @media (max-width: 560px) { #recitszone aside.epoque dl { grid-template-columns: 1fr; gap: 0; } #recitszone aside.epoque dd { margin-bottom: 8px; } }
  /* Vue Recherches : tableau de bord des recherches à faire, même habillage que les récits. */
  #rechercheszone { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 18px 22px 24px; max-height: 78vh; overflow: auto; }
  #rechercheszone h2 { margin: 0; font-size: 21px; font-weight: 600; text-wrap: balance; }
  #rechercheszone .aide { margin: 4px 0 14px; font: 13px/1.45 var(--sans); color: var(--muted); max-width: 72ch; }
  #rechercheszone .sommaire { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 4px 0 0; font: 13px var(--sans); }
  #rechercheszone .sommaire a { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--ink); text-decoration: none; cursor: pointer; }
  .rq-chiffres { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 0 0 16px; }
  .rq-chiffre { min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .rq-chiffre > b { display: block; font: 600 24px/1.15 var(--serif); font-variant-numeric: tabular-nums; }
  .rq-chiffre > span { display: block; margin-top: 2px; font: 12px/1.35 var(--sans); color: var(--muted); }
  .rq-fiab { display: flex; gap: 2px; height: 10px; margin: 8px 0 7px; }
  .rq-fiab i { display: block; min-width: 3px; border-radius: 2px; }
  .rq-fiab i.A { background: var(--fa); } .rq-fiab i.B { background: var(--fb); } .rq-fiab i.C { background: var(--fc); } .rq-fiab i.D { background: var(--fd); }
  .rq-fiab-leg { display: flex; flex-wrap: wrap; gap: 2px 12px; font: 12px/1.4 var(--sans); color: var(--muted); }
  .rq-fiab-leg .niv { gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; } .rq-fiab-leg .niv b { font: 500 12px var(--sans); color: var(--ink); }
  .rq-gens { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 28px; margin: 0 0 6px; }
  .rq-gens table { border-collapse: collapse; font: 13px/1.3 var(--sans); min-width: min(100%, 420px); }
  .rq-gens caption { text-align: left; padding: 0 0 4px; font: 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .rq-gens th, .rq-gens td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rq-gens th { font-weight: 500; font-size: 12px; color: var(--muted); white-space: normal; vertical-align: bottom; }
  .rq-gens th:first-child, .rq-gens td:first-child { text-align: left; padding-left: 0; }
  .rq-gens td small { color: var(--muted); font-size: 12px; }
  .rq-gens .jauge { display: inline-block; width: 56px; height: 6px; margin-left: 8px; border-radius: 3px; background: var(--line); vertical-align: 1px; overflow: hidden; }
  .rq-gens .jauge i { display: block; height: 100%; background: var(--accent); }
  .rq-gens td.manque { color: var(--fc); font-weight: 500; }
  .rq-filtres { position: sticky; top: -18px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; padding: 10px 0; background: var(--surface); border-bottom: 1px solid var(--line); font: 13px var(--sans); }
  .rq-filtres input, .rq-filtres select { height: 36px; padding: 0 10px; font: 14px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .rq-filtres input { flex: 1 1 220px; max-width: 360px; }
  .rq-filtres select { flex: 0 1 auto; max-width: 100%; cursor: pointer; }
  .rq-filtres select.on, .rq-filtres input.on { border-color: var(--hl); box-shadow: 0 0 0 1px var(--hl); }
  .rq-filtres output { flex: 1 0 100%; color: var(--muted); font-size: 12px; }
  .rq-sec { margin: 22px 0 0; scroll-margin-top: 112px; }
  .rq-sec > .aide { margin-bottom: 6px; }
  .rq-groupe { margin: 10px 0 0; }
  .rq-groupe > summary { cursor: pointer; padding: 6px 0; font: 500 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .rq-groupe > summary span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .rq-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px; align-items: start; }
  .rq-bloc { position: relative; display: block; width: 100%; min-width: 0; padding: 8px 12px 9px; text-align: left; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 8px; }
  .rq-bloc.M { border-left-color: var(--m); } .rq-bloc.F { border-left-color: var(--f); }
  button.rq-bloc, .rq-bloc .rq-tete { cursor: pointer; }
  button.rq-bloc:hover, .rq-bloc:has(.rq-tete:hover) { border-color: var(--accent); }
  .rq-bloc .rq-tete { display: block; width: 100%; padding: 0; text-align: left; font: inherit; color: inherit; background: none; border: 0; }
  .rq-bloc .n { display: block; padding-right: 18px; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .rq-bloc .d { display: block; margin-top: 1px; font: 12px/1.4 var(--sans); color: var(--muted); }
  .rq-bloc > .niv, .rq-bloc .rq-tete > .niv { position: absolute; top: 11px; right: 10px; }
  .rq-bloc .direct { font: 500 11px var(--sans); color: var(--accent); }
  .rq-bloc .manque { display: block; margin-top: 4px; font: 500 12px/1.4 var(--sans); color: var(--fc); }
  .rq-bloc .piste { display: block; margin: 5px 0 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .rq-bloc .piste.replie { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
  .rq-bloc .piste a[data-id] { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; }
  .rq-bloc ul { margin: 5px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.45; }
  .rq-bloc ul li { margin: 2px 0; } .rq-bloc ul li::marker { color: var(--fc); }
  .rq-plus { margin-top: 4px; padding: 4px 0; font: 500 12px var(--sans); color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .rq-vide { font: 13px var(--sans); color: var(--muted); }
  /* Commentaires de la famille (servis par le Worker : absents en file:// ou sans l'API). */
  #fiche .cm { margin-top: 18px; border-top: 1px solid var(--line); }
  .cm-liste { list-style: none; padding: 0 !important; margin: 4px 0 0 !important; }
  .cm-liste li { margin: 6px 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .cm-liste li.masque, .cm-encart li.masque { opacity: .6; border-style: dashed; }
  .cm-qui { font: 12px/1.4 var(--sans); color: var(--muted); overflow-wrap: anywhere; }
  .cm-qui b { font-weight: 500; color: var(--ink); }
  .cm-texte { margin: 3px 0 0 !important; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cm-act { margin-top: 6px; min-height: 32px; padding: 0 10px; font: 500 12px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .cm-act:hover { border-color: var(--accent); }
  .cm-form { display: grid; gap: 8px; margin-top: 8px; }
  .cm-form label { display: grid; gap: 4px; font: 12px var(--sans); color: var(--muted); }
  .cm-form input, .cm-form textarea { width: 100%; padding: 8px 10px; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }

  // Recherche d'une personne par son nom.
  const sansAccent = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const index = Object.keys(P).filter(id => !P[id].inconnu).map(id => [id, sansAccent([P[id].prenoms, P[id].nom, P[id].nomNaissance].filter(Boolean).join(" "))]);
  $("cherche").addEventListener("input", e => {
    const mots = sansAccent(e.target.value).split(/\s+/).filter(Boolean), res = $("resultats");
    if (!mots.length) { res.hidden = true; return; }
    const trouves = index.filter(([, t]) => mots.every(m => t.includes(m))).slice(0, 8);
    res.innerHTML = trouves.length ? trouves.map(([id]) => rang(id, anneesDe(P[id]) || "dates inconnues")).join("") : `<p class="aide">Personne à ce nom.</p>`;
    res.hidden = false;
  });
  function titrer() {
    const r = P[racine], connus = Object.values(P).filter(p => !p.inconnu).length;
    const c = couple && conjoint && P[conjoint];
    $("titre").textContent = `Arbre généalogique de ${r.prenoms} ${r.nomNaissance || r.nom}` + (c ? ` et ${c.prenoms} ${c.nomNaissance || c.nom}` : "");
    $("resume").textContent = `${connus} personnes en tout, ${Object.keys(pos).length} dans cette ascendance sur ${maxGen + 1} générations. Touchez une case pour ouvrir sa fiche ; pincez ou utilisez les boutons pour zoomer.`;
    document.querySelectorAll("#racines button").forEach(b => b.setAttribute("aria-pressed", b.dataset.racine === (couple ? "couple" : racine)));
  }
  function changerRacine(id) {
    couple = id === "couple"; racine = couple ? FAMILLE.racine : id; construire(); titrer(); montrer(racine, false);
    if (vue === "arbre") { zoomer(mobile() ? 0.8 : 0.7); centrer(racine, true); }
    if (vue === "recherches") dessinerRecherches();
  }
  const autre = P[racine].conjoint || Object.keys(P).find(k => P[k].conjoint === racine);
  if (autre && (P[autre].pere || P[autre].mere))
    $("racines").innerHTML = [racine, autre].map(id => `<button type="button" data-racine="${id}" aria-pressed="false">${esc(P[id].prenoms)}</button>`).join("") + `<button type="button" data-racine="couple" aria-pressed="false">Les deux</button>`;
  else { $("racines").hidden = true; couple = false; construire(); }
  titrer();
  montrer(racine, false);
  zoomer(mobile() ? 0.8 : 0.7);
  centrer(racine, true);
  // Sur mobile la hauteur définitive n'est connue qu'après la mise en page : on recentre une fois.
  requestAnimationFrame(() => requestAnimationFrame(() => { if (vue === "arbre") centrer(courant, true); }));
  if (["#carte", "#frise", "#famille", "#recits", "#recherches"].includes(location.hash)) choisirVue(location.hash.slice(1));
  // Lien direct vers une fiche (?fiche=<id>).
  let ficheDemandee = null; try { ficheDemandee = new URLSearchParams(location.search).get("fiche"); } catch (e) {}
  if (ficheDemandee && P[ficheDemandee]) montrer(ficheDemandee, true);
  chargerCm();
  addEventListener("hashchange", () => choisirVue(location.hash.slice(1)));
})();
</script>
</body>
</html>
